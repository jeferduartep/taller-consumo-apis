<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería · Contact Sheet</title>

  <!-- Tipografías: una display condensada para títulos y una mono para los datos técnicos de cada foto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <h1>Galería <span>de arte</span></h1>
    <p class="subtitle">Explora nuestra colección de obras maestras</p>
  </header>

  <main>
    <!-- Barra de estado / controles -->
    <section class="controls">
      <span id="status" class="status">Cargando rollo de fotos…</span>
      <button id="btnReload" class="btn-reload">↻ Recargar rollo</button>
    </section>

    <!-- Aquí se inyectan las tarjetas de fotos vía JS -->
    <section id="galeria" class="galeria" aria-live="polite"></section>
  </main>

  <footer>
    <p>Taller de Consumo de APIs · Programación Web 2 · Ejercicio 1</p>
  </footer>

  <script src="galeria.js"></script>
</body>
</html>
